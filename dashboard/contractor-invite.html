<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Up Field Work Hub</title>
  <link rel="icon" type="image/png" href="fwh-icon.png?v=fwh-branding-20261002-1">
  <link rel="stylesheet" href="styles.css?v=modern-premium-stage8-setup-20261017">
</head>
<body class="fwh-setup-page">
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Field Work Hub</p>
      <h1>Set Up Your Contractor Account</h1>
      <p class="muted">Open the setup link your Admin shared with you, then choose your own password. Your Admin never sees this password.</p>

      <div id="invite-check" class="check" role="status" aria-live="polite">Checking invitation…</div>

      <form id="password-form" class="admin-form hidden" autocomplete="off">
        <p id="invite-identity" class="muted"></p>

        <label>New password
          <input id="new-password" type="password" required minlength="10" autocomplete="new-password">
        </label>

        <label>Confirm password
          <input id="confirm-password" type="password" required minlength="10" autocomplete="new-password">
        </label>

        <button id="set-password" type="submit">Finish Account Setup</button>
        <p id="setup-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="contractor-invite.js?v=modern-premium-stage10-copy-20261017" defer></script>
</body>
</html>
