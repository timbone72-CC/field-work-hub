name: Governance Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR governance classification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          required_fields = [
              "Scope key",
              "Goal",
              "Affected surfaces",
              "Change level",
              "Authoritative branch",
              "Required rule packs",
              "Protected behavior",
              "External systems changed",
              "Rollback point",
              "Verification boundary",
              "Level 3 merge approval",
          ]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          pr = event["pull_request"]
          body = pr.get("body") or ""
          number = pr["number"]
          head_branch = pr["head"]["ref"]
          draft = bool(pr.get("draft"))
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def field_value(name, text=body):
              match = re.search(
                  rf"(?mi)^\s*-\s*{re.escape(name)}\s*:\s*(.*?)\s*$",
                  text,
              )
              if not match:
                  return None
              value = match.group(1).strip()
              value = re.sub(r"<!--.*?-->", "", value).strip()
              return value

          errors = []
          values = {}
          for name in required_fields:
              value = field_value(name)
              values[name] = value
              if not value:
                  errors.append(f"Missing or empty required field: {name}")

          level = values.get("Change level")
          if level and level not in {"Level 1", "Level 2", "Level 3"}:
              errors.append("Change level must be exactly Level 1, Level 2, or Level 3.")

          branch_value = values.get("Authoritative branch")
          if branch_value and branch_value != head_branch:
              errors.append(
                  f"Authoritative branch must match PR head branch: expected {head_branch!r}, "
                  f"found {branch_value!r}."
              )

          approval = values.get("Level 3 merge approval")
          if level == "Level 3":
              if approval not in {"PENDING", "APPROVED"}:
                  errors.append(
                      "Level 3 merge approval must be PENDING or APPROVED."
                  )
              if not draft and approval != "APPROVED":
                  errors.append(
                      "A non-draft Level 3 PR must record Level 3 merge approval as APPROVED."
                  )
          elif approval and approval != "N/A":
              errors.append("Level 1/2 PRs must record Level 3 merge approval as N/A.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "field-work-hub-governance-check",
          }

          def github_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          scope_key = values.get("Scope key")
          if scope_key:
              page = 1
              duplicates = []
              while True:
                  url = (
                      f"https://api.github.com/repos/{repository}/pulls"
                      f"?state=open&per_page=100&page={page}"
                  )
                  pulls = github_json(url)
                  if not pulls:
                      break
                  for other in pulls:
                      if other["number"] == number:
                          continue
                      other_body = other.get("body") or ""
                      match = re.search(
                          r"(?mi)^\s*-\s*Scope key\s*:\s*(.*?)\s*$",
                          other_body,
                      )
                      if not match:
                          continue
                      other_scope = re.sub(
                          r"<!--.*?-->",
                          "",
                          match.group(1),
                      ).strip()
                      if other_scope == scope_key:
                          duplicates.append(other["number"])
                  if len(pulls) < 100:
                      break
                  page += 1
              if duplicates:
                  errors.append(
                      f"Scope key {scope_key!r} is already used by open PR(s): "
                      + ", ".join(f"#{n}" for n in duplicates)
                      + ". Continue or explicitly supersede that line instead of opening a competing implementation."
                  )

          changed_files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/pulls/{number}/files"
                  f"?per_page=100&page={page}"
              )
              files = github_json(url)
              if not files:
                  break
              changed_files.extend(item["filename"] for item in files)
              if len(files) < 100:
                  break
              page += 1

          # FWH v1: feature delivery, activation, acceptance and release.
          # Metadata validation only: evidence truth and operator consent remain external.
          controlled_paths = ("app/", "dashboard/", "supabase/", "ci/")
          runtime_workflow_change = any(
              path.startswith(".github/workflows/")
              and path != ".github/workflows/governance-check.yml"
              for path in changed_files
          )
          touches_runtime = (
              any(path.startswith(controlled_paths) for path in changed_files)
              or runtime_workflow_change
          )
          gate = field_value("Acceptance gate")
          feature = field_value("Feature ID")
          lane = field_value("Work lane")
          before_state = field_value("Feature state before")
          after_state = field_value("Feature state after")
          outcome = field_value("Work outcome")
          activation = field_value("Activation/rollback boundary")
          evidence_ref = field_value("Acceptance evidence reference")
          physical = field_value("New physical/provider evidence")
          permitted_gates = {f"FWH-AC{i}" for i in range(1, 6)}
          permitted_features = {f"FWH-F{i:02}" for i in range(1, 9)}
          permitted_states = {
              "WORKING", "BUILT_INACTIVE", "PARTIAL", "NOT_BUILT", "DEFERRED"
          }
          feature_by_gate = {
              "FWH-AC1": {"FWH-F03", "FWH-F04"},
              "FWH-AC2": {"FWH-F03", "FWH-F05"},
              "FWH-AC3": {
                  "FWH-F01", "FWH-F02", "FWH-F03",
                  "FWH-F06", "FWH-F07", "FWH-F08",
              },
              "FWH-AC4": permitted_features,
              "FWH-AC5": permitted_features,
          }
          if touches_runtime:
              if gate not in permitted_gates | {"FWH-SAFETY"}:
                  errors.append(
                      "Runtime/CI PR needs an existing Acceptance gate FWH-AC1..AC5 "
                      "or FWH-SAFETY linked to a real issue."
                  )
              if feature not in permitted_features | {"FWH-PLATFORM"}:
                  errors.append(
                      "Runtime/CI PR must name Feature ID FWH-F01..F08 "
                      "or FWH-PLATFORM (shared operations only)."
                  )
              if gate in feature_by_gate and feature != "FWH-PLATFORM" and (
                  feature not in feature_by_gate[gate]
              ):
                  errors.append(
                      f"Feature ID {feature} is not assigned to {gate}; "
                      "use its owning gate or reconcile the governed plan."
                  )
              if lane not in {"FINISH", "ACTIVATE", "ACCEPT", "RELEASE", "SAFETY"}:
                  errors.append(
                      "Runtime/CI PR needs Work lane FINISH/ACTIVATE/ACCEPT/RELEASE "
                      "(SAFETY only for FWH-SAFETY incident)."
                  )
              if (gate == "FWH-SAFETY") != (lane == "SAFETY"):
                  errors.append("SAFETY work lane and FWH-SAFETY gate must be paired.")
              if lane == "RELEASE" and gate not in {"FWH-AC4", "FWH-AC5"}:
                  errors.append("RELEASE lane belongs to internal or configured-company pilot.")
              for key, state in (
                  ("Feature state before", before_state),
                  ("Feature state after", after_state),
              ):
                  if state not in permitted_states:
                      errors.append(
                          f"{key} must be WORKING, BUILT_INACTIVE, PARTIAL, "
                          "NOT_BUILT or DEFERRED."
                      )
              if not outcome or outcome.casefold() in {"none", "n/a", "tbd"} or (
                  len(outcome) < 12
              ):
                  errors.append(
                      "Work outcome must identify concrete feature behavior advanced, "
                      "not a new test round or vague summary."
                  )
              if feature == "FWH-PLATFORM" and not (
                  outcome and re.search(r"\bFWH-F0[1-8]\b", outcome)
              ):
                  errors.append(
                      "FWH-PLATFORM requires impacted FWH-F## feature IDs "
                      "in Work outcome; it is not a generic scope bypass."
                  )
              if lane == "ACTIVATE" and (
                  not activation or activation.casefold() in {"n/a", "none", "tbd"}
              ):
                  errors.append(
                      "ACTIVATE requires exact environment/configuration and "
                      "rollback boundary, not implicit release authority."
                  )
              if (lane in {"ACCEPT", "RELEASE"} or (
                  after_state == "WORKING" and before_state != "WORKING"
              )) and (
                  not evidence_ref or evidence_ref.casefold() in {"none", "n/a", "tbd"}
              ):
                  errors.append(
                      "ACCEPT/RELEASE or a newly WORKING feature requires "
                      "an exact acceptance evidence reference."
                  )
              if gate == "FWH-SAFETY":
                  incident = field_value("Safety incident URL")
                  if not incident or not re.match(
                      r"^https://github\.com/[^/]+/[^/]+/issues/[0-9]+(?:\b|/|$)",
                      incident,
                  ):
                      errors.append(
                          "FWH-SAFETY requires a real linked GitHub issue."
                      )
              if physical is None:
                  errors.append(
                      "Runtime/CI PR must declare New physical/provider evidence: "
                      "NONE or FWH-AC#: <specific unaccepted reality boundary>."
                  )
              elif physical != "NONE":
                  if (
                      gate not in permitted_gates | {"FWH-SAFETY"}
                      or not physical.startswith(str(gate) + ": ")
                      or not physical[len(str(gate)) + 2:].strip()
                  ):
                      errors.append(
                          "New physical/provider evidence must be NONE or start with "
                          "the exact declared gate and a specific previously "
                          "unaccepted device/provider reality boundary."
                      )
          elif gate and gate not in permitted_gates | {"FWH-SAFETY", "N/A"}:
              errors.append("Unrecognized Acceptance gate; use N/A for governance-only work.")

          if level == "Level 1" and any(
              path.startswith(".github/workflows/") for path in changed_files
          ):
              errors.append(
                  "GitHub Actions workflow changes require at least Level 2 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.startswith("supabase/") for path in changed_files
          ):
              errors.append(
                  "Changes under supabase/ require Level 3 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.endswith((".jks", ".keystore")) for path in changed_files
          ):
              errors.append(
                  "Signing-keystore changes require Level 3 governance."
              )

          # Match declared PR scope against objective file ownership boundaries.
          # This does not prove that edits within a boundary were approved.
          declared_surfaces = (values.get("Affected surfaces") or "").casefold()
          guarded_surfaces = (
              ("app/", "Android client", ("android", "mobile", "room", "camera", "contractor client")),
              ("dashboard/", "Admin dashboard", ("dashboard", "admin", "browser", "web")),
              ("supabase/", "Supabase backend", ("supabase", "sql", "database", "auth", "rls", "rpc", "storage", "edge")),
              (".github/workflows/", "GitHub Actions", ("github actions", "ci", "workflow", "pipeline", "governance")),
          )
          for prefix, label, aliases in guarded_surfaces:
              if any(path.startswith(prefix) for path in changed_files) and not any(
                  re.search(r"\b" + re.escape(alias) + r"\b", declared_surfaces)
                  for alias in aliases
              ):
                  errors.append(
                      f"{label} files changed under {prefix!r}, but 'Affected surfaces' "
                      "does not declare that component. Reconcile the scope before proceeding."
                  )

          verification = (values.get("Verification boundary") or "").strip().casefold()
          if re.match(r"^(?:docs?|documentation|markdown)[ -]only\b", verification) and any(
              not path.endswith(".md") for path in changed_files
          ):
              errors.append(
                  "Verification boundary claims documentation-only review, "
                  "but the PR changes non-Markdown files."
              )

          # Reuse the existing PR handoff section; don't introduce a new form.
          # This validates presence of a checkpoint, not truth of reported evidence.
          if level in {"Level 2", "Level 3"}:
              handoff_heading = re.search(
                  r"(?im)^##[ \t]+Evidence[ \t]*/[ \t]*Remaining[ \t]+Gates[ \t]*$",
                  body,
              )
              if not handoff_heading:
                  errors.append(
                      "Level 2/3 work requires the existing 'Evidence / Remaining Gates' "
                      "PR section for durable handoff."
                  )
              else:
                  handoff_tail = body[handoff_heading.end():]
                  following_heading = re.search(r"(?m)^##[ \t]+", handoff_tail)
                  handoff_text = handoff_tail[
                      :following_heading.start() if following_heading else None
                  ]
                  handoff_text = re.sub(
                      r"<!--.*?-->", "", handoff_text, flags=re.DOTALL
                  ).strip()
                  if not handoff_text:
                      errors.append(
                          "The 'Evidence / Remaining Gates' section is empty; "
                          "preserve verified evidence and record the next checkpoint."
                      )
                  else:
                      if not re.search(
                          r"\b(?:pass|passed|success|verified|accepted|blocked|fail|failed|pending|not required|not run)\b",
                          handoff_text, flags=re.IGNORECASE
                      ):
                          errors.append(
                              "The handoff must identify actual PASS/BLOCKED/FAIL/PENDING "
                              "evidence (or state that verification is not required)."
                          )
                      if not re.search(r"\bnext\b", handoff_text, flags=re.IGNORECASE):
                          errors.append(
                              "The handoff must state the next checkpoint so subsequent "
                              "AI sessions can resume without restarting accepted work."
                          )

          if errors:
              print("Governance check FAILED:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Governance check PASS")
          print(f"PR: #{number}")
          print(f"Scope key: {scope_key}")
          print(f"Change level: {level}")
          print(f"Authoritative branch: {head_branch}")
          print(f"Draft: {draft}")
          print(f"Changed files inspected: {len(changed_files)}")
          PY
