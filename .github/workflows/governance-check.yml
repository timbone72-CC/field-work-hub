name: Governance Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR governance classification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.request

          required_fields = [
              "Scope key",
              "Goal",
              "Affected surfaces",
              "Change level",
              "Authoritative branch",
              "Required rule packs",
              "Protected behavior",
              "External systems changed",
              "Rollback point",
              "Verification boundary",
              "Level 3 merge approval",
          ]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          pr = event["pull_request"]
          body = pr.get("body") or ""
          number = pr["number"]
          head_branch = pr["head"]["ref"]
          draft = bool(pr.get("draft"))
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def field_value(name, text=body):
              match = re.search(
                  rf"(?mi)^\s*-\s*{re.escape(name)}\s*:\s*(.*?)\s*$",
                  text,
              )
              if not match:
                  return None
              value = match.group(1).strip()
              value = re.sub(r"<!--.*?-->", "", value).strip()
              return value

          errors = []
          values = {}
          for name in required_fields:
              value = field_value(name)
              values[name] = value
              if not value:
                  errors.append(f"Missing or empty required field: {name}")

          level = values.get("Change level")
          if level and level not in {"Level 1", "Level 2", "Level 3"}:
              errors.append("Change level must be exactly Level 1, Level 2, or Level 3.")

          branch_value = values.get("Authoritative branch")
          if branch_value and branch_value != head_branch:
              errors.append(
                  f"Authoritative branch must match PR head branch: expected {head_branch!r}, "
                  f"found {branch_value!r}."
              )

          approval = values.get("Level 3 merge approval")
          if level == "Level 3":
              if approval not in {"PENDING", "APPROVED"}:
                  errors.append(
                      "Level 3 merge approval must be PENDING or APPROVED."
                  )
              if not draft and approval != "APPROVED":
                  errors.append(
                      "A non-draft Level 3 PR must record Level 3 merge approval as APPROVED."
                  )
          elif approval and approval != "N/A":
              errors.append("Level 1/2 PRs must record Level 3 merge approval as N/A.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "field-work-hub-governance-check",
          }

          def github_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          scope_key = values.get("Scope key")
          if scope_key:
              page = 1
              duplicates = []
              while True:
                  url = (
                      f"https://api.github.com/repos/{repository}/pulls"
                      f"?state=open&per_page=100&page={page}"
                  )
                  pulls = github_json(url)
                  if not pulls:
                      break
                  for other in pulls:
                      if other["number"] == number:
                          continue
                      other_body = other.get("body") or ""
                      match = re.search(
                          r"(?mi)^\s*-\s*Scope key\s*:\s*(.*?)\s*$",
                          other_body,
                      )
                      if not match:
                          continue
                      other_scope = re.sub(
                          r"<!--.*?-->",
                          "",
                          match.group(1),
                      ).strip()
                      if other_scope == scope_key:
                          duplicates.append(other["number"])
                  if len(pulls) < 100:
                      break
                  page += 1
              if duplicates:
                  errors.append(
                      f"Scope key {scope_key!r} is already used by open PR(s): "
                      + ", ".join(f"#{n}" for n in duplicates)
                      + ". Continue or explicitly supersede that line instead of opening a competing implementation."
                  )

          changed_files = []
          file_changes = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/pulls/{number}/files"
                  f"?per_page=100&page={page}"
              )
              files = github_json(url)
              if not files:
                  break
              changed_files.extend(item["filename"] for item in files)
              file_changes.extend(files)
              if len(files) < 100:
                  break
              page += 1

          # Compact FWH v1 business handoff. No new test/approval framework.
          # Core scope, rollback, approval and verification fields above still apply.
          controlled_paths = ("app/", "dashboard/", "supabase/", "ci/", "tests/")
          root_build_files = {"build.gradle", "settings.gradle", "gradle.properties"}
          runtime_workflow_change = any(
              path.startswith(".github/workflows/")
              and path != ".github/workflows/governance-check.yml"
              for path in changed_files
          )
          touches_runtime = (
              any(path.startswith(controlled_paths) for path in changed_files)
              or any(path in root_build_files for path in changed_files)
              or runtime_workflow_change
          )
          feature_milestone = field_value("Feature / milestone")
          lane = field_value("Work lane")
          outcome = field_value("Business outcome")
          physical = field_value("New physical/provider evidence")
          feature_match = re.fullmatch(
              r"(FWH-F0[1-8]|FWH-PLATFORM)\s*/\s*(FWH-AC[1-5])",
              feature_milestone or "",
          )
          is_safety = feature_milestone == "FWH-SAFETY"
          feature_by_gate = {
              "FWH-AC1": {"FWH-F03", "FWH-F04"},
              "FWH-AC2": {"FWH-F03", "FWH-F05"},
              "FWH-AC3": {
                  "FWH-F01", "FWH-F02", "FWH-F03",
                  "FWH-F06", "FWH-F07", "FWH-F08",
              },
              "FWH-AC4": {f"FWH-F{i:02}" for i in range(1, 9)},
              "FWH-AC5": {f"FWH-F{i:02}" for i in range(1, 9)},
          }
          if touches_runtime:
              if not feature_match and not is_safety:
                  errors.append(
                      "Runtime/CI PR needs Feature / milestone: FWH-F04 / FWH-AC1 "
                      "(or FWH-PLATFORM / FWH-AC#, or FWH-SAFETY for an incident)."
                  )
              if lane not in {"FINISH", "ACTIVATE", "ACCEPT", "RELEASE", "SAFETY"}:
                  errors.append(
                      "Runtime/CI PR needs Work lane: FINISH, ACTIVATE, ACCEPT, RELEASE or SAFETY."
                  )
              if is_safety != (lane == "SAFETY"):
                  errors.append("SAFETY lane requires FWH-SAFETY and vice versa.")
              if not outcome or len(outcome) < 12 or outcome.casefold() in {
                  "none", "n/a", "tbd",
              }:
                  errors.append(
                      "Business outcome must state what usable behavior or fix this PR advances."
                  )
              if feature_match:
                  feature, gate = feature_match.groups()
                  if feature != "FWH-PLATFORM" and feature not in feature_by_gate[gate]:
                      errors.append(
                          f"Feature {feature} does not belong to milestone {gate}."
                      )
                  if feature == "FWH-PLATFORM" and not re.search(
                      r"\bFWH-F0[1-8]\b", outcome or ""
                  ):
                      errors.append(
                          "Shared PLATFORM work must name the affected FWH-F## in Business outcome."
                      )
                  if lane == "RELEASE" and gate not in {"FWH-AC4", "FWH-AC5"}:
                      errors.append("RELEASE lane belongs to Phase 7/8 pilot milestone.")
              else:
                  gate = "FWH-SAFETY" if is_safety else None
              if is_safety and not re.search(
                  r"https://github\.com/[^/\s]+/[^/\s]+/issues/[0-9]+\b",
                  outcome or "",
              ):
                  errors.append("SAFETY outcome must link the real incident issue.")
              if physical is None:
                  errors.append(
                      "Declare New physical/provider evidence: NONE, or "
                      "FWH-AC#: specific unproven reality boundary."
                  )
              elif physical != "NONE":
                  prefix = (gate or "") + ": "
                  detail = physical[len(prefix):] if physical.startswith(prefix) else ""
                  if detail.startswith("NEW: ") and detail[5:].strip():
                      pass
                  elif detail.startswith("INVALIDATED: ") and re.fullmatch(
                      r"INVALIDATED: \S.*; Prior evidence: \S.*; Changed boundary: \S.*", detail
                  ):
                      pass
                  else:
                      errors.append("Use NONE, milestone: NEW: specific unproven behavior, "
                                    "or milestone: INVALIDATED: scenario; Prior evidence: reference; "
                                    "Changed boundary: concrete change or contradiction.")
          # Exactly one business construction task is selected on trusted main.
          # Read the PR base SHA rather than executing or trusting fork code.
          # Safety incident and governance-only work retain their existing paths.
          if touches_runtime and not is_safety:
              task_id = field_value("Construction task")
              if not task_id:
                  errors.append("Business runtime PR must name Construction task from docs/ROADMAP.md.")
              else:
                  try:
                      base_sha = pr["base"]["sha"]
                      if not re.fullmatch(r"[0-9a-fA-F]{40}", base_sha):
                          raise ValueError("Invalid trusted PR base revision")
                      doc = github_json(
                          f"https://api.github.com/repos/{repository}/contents/docs/ROADMAP.md?ref={base_sha}"
                      )
                      roadmap = base64.b64decode(doc["content"]).decode("utf-8")
                      marker = "## Completion-first V1 construction register —"
                      if roadmap.count(marker) != 1:
                          raise ValueError("Authoritative construction register missing or duplicated")
                      block = roadmap.split(marker, 1)[1].split("\n## ", 1)[0]

                      def task_marker(label):
                          matches = re.findall(
                              rf"(?m)^- {re.escape(label)}: \*\*([A-Za-z0-9-]+)\*\*$",
                              block,
                          )
                          if len(matches) != 1:
                              raise ValueError(f"Construction marker invalid: {label}")
                          return matches[0]

                      primary = task_marker("Primary subphase")
                      selected = task_marker("Next construction task")
                      rows = re.findall(
                          r"(?m)^\|\s*\*\*((?:[568][A-F]?|7)-T\d{2})\*\*\s*\|\s*([^|]+)\|\s*([^|]+)\|",
                          block,
                      )
                      tasks = {}
                      for name, owner, state in rows:
                          if name in tasks:
                              raise ValueError(f"Duplicate construction task: {name}")
                          tasks[name] = (owner.strip(), state.strip())
                      if not tasks or selected not in tasks:
                          raise ValueError("Selected construction task absent from register")
                      active_tasks = [name for name, (_, state) in tasks.items() if state == "ACTIVE"]
                      if active_tasks != [selected]:
                          raise ValueError("Exactly one selected ACTIVE construction task is required")
                      if not selected.startswith(primary + "-"):
                          raise ValueError("Primary subphase and selected task disagree")
                      if task_id != selected:
                          errors.append(
                              f"Construction task {task_id!r} is not the selected {selected!r} "
                              f"in trusted main roadmap. Finish this task or record its real blocker "
                              "and return/successor in the same existing roadmap first."
                          )
                      elif feature_milestone != tasks[selected][0]:
                          errors.append(
                              f"Construction task {selected} belongs to "
                              f"{tasks[selected][0]}, not {feature_milestone!r}."
                          )
                  except (KeyError, TypeError, ValueError, UnicodeError) as exc:
                      errors.append(f"Cannot validate trusted construction register: {exc}")

          # Permanent business functionality: inspect only added operational lines.
          # Fixtures/tests/docs and removal of old temporary code are not exceptions.
          def operational(path):
              return path in {"app/build.gradle", "build.gradle", "gradle.properties"} or (
                  path.startswith(("app/src/main/", "dashboard/", "supabase/functions/",
                                   "supabase/migrations/", "ci/"))
                  and not re.search(r"(?:^|/)(?:tests?|__tests__|fixtures|testdata)(?:/|$)", path, re.I)
                  and not re.search(r"(?:^|/)(?:test_[^/]+|[^/]+\.(?:test|spec)\.[^/]+)$", path, re.I)
                  and path.endswith((".java", ".kt", ".js", ".ts", ".tsx", ".jsx",
                                     ".py", ".sql", ".gradle", ".json", ".html", ".sh"))
              )

          def inspect_additions(item):
              path = item["filename"]
              if not operational(path) or item.get("status") == "removed" or not item.get("additions"):
                  return []
              added = [line[1:] for line in (item.get("patch") or "").splitlines() if line.startswith("+")]
              if len(added) != item["additions"]:
                  return ["incomplete operational diff"]
              found = set()
              for line in added:
                  if re.match(r"\s*(?://|#|--|/\*|\*)", line):
                      continue
                  ids = re.findall(r"(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", line)
                  if any(x != "00000000-0000-0000-0000-000000000000" for x in ids):
                      found.add("literal UUID: potential hardcoded business identity")
                  if re.search(r"""(?i)['"](?:TEST-P[0-9]|TEST-WO-|TEST-FWH-|FWH-TEST-WO-|TEST-[0-9]{4})[^'"]*['"]""", line):
                      found.add("literal TEST work-order identity")
                  if re.search(r"(?i)\b(?:fwh[_-]?(?:cleanup|delivery|readiness)[_-]?test|(?:cleanup|delivery|package|photo|work[_-]?order|job)[_-]?(?:test|pin)[_-]?(?:photo|package|work[_-]?order|job|id|slot|enabled|mode|worker|dispatcher|path)\w*|(?:temporary|alternate|parallel|test[_-]?only)[_-]?(?:updater|worker|dispatcher)\w*)\b", line):
                      found.add("temporary/pinned or parallel operational path")
                  if path.endswith((".gradle", ".properties", ".sql", ".json")) and re.search(
                      r"(?i)(?:automatic[_-]?cleanup[_-]?enabled|(?:client[_-]?)?delivery[_-]?dispatch[_-]?enabled|cleanupEnabled)\b.{0,100}(?:\bfalse\b|\boff\b)", line
                  ) and not re.search(r"(?i)\b(?:recoveryBuild|recovery[_-]?mode|kill[_-]?switch|rollback)\b", line):
                      found.add("new default-OFF cleanup/delivery gate")
              return sorted(found)

          def sample(path, line):
              return {"filename": path, "status": "modified", "additions": 1, "patch": "+" + line}

          # Focused regression cases run on the trusted workflow, not proposed code.
          assert inspect_additions(sample("app/build.gradle", "def pin = 'd23443e0-2abb-4df4-912f-859b9367aaef'"))
          assert inspect_additions(sample("app/src/main/X.java", 'String id = "TEST-P4-FINISH-1005";'))
          assert inspect_additions(sample("app/src/main/X.java", "String CLEANUP_TEST_PHOTO_ID;"))
          assert inspect_additions(sample("app/build.gradle", "AUTOMATIC_CLEANUP_ENABLED = false"))
          assert not inspect_additions(sample("app/src/test/X.java", 'String id = "TEST-P4-FINISH-1005";'))
          assert not inspect_additions(sample("app/src/main/X.java", "return ownerId.equals(receipt.photoId);"))
          assert not inspect_additions(sample("app/build.gradle", "AUTOMATIC_CLEANUP_ENABLED = recoveryBuild ? false : true"))
          assert inspect_additions({"filename": "app/build.gradle", "additions": 2, "patch": "+one"}) == ["incomplete operational diff"]
          assert not inspect_additions({"filename": "app/build.gradle", "additions": 0, "patch": "-old pin"})

          findings = [(item["filename"], result) for item in file_changes for result in inspect_additions(item)]
          errors.extend(path + ": " + result for path, result in findings if result == "incomplete operational diff")
          exception = field_value("Completion exception")
          if any(result != "incomplete operational diff" for _, result in findings) or exception not in (None, "NONE"):
              approved = False
              if not exception or not re.fullmatch(r"NECESSARY: \S.*; Remove when: \S.*", exception):
                  errors.append("Use Completion exception: NECESSARY: reason; Remove when: condition.")
              else:
                  owner = pr["base"]["repo"]["owner"]["login"]
                  marker = f"APPROVE COMPLETION EXCEPTION #{number} {pr['head']['sha']}"
                  page = 1
                  while True:
                      comments = github_json(f"https://api.github.com/repos/{repository}/issues/{number}/comments?per_page=100&page={page}")
                      if any(c.get("user", {}).get("login") == owner and c.get("author_association") == "OWNER"
                             and marker in (c.get("body") or "").splitlines() for c in comments):
                          approved = True
                          break
                      if len(comments) < 100:
                          break
                      page += 1
                  if not approved:
                      errors.append("Independent repository-owner approval required on exact head: " + marker)
              if not approved:
                  errors.extend(path + ": " + result for path, result in findings if result != "incomplete operational diff")

          # Documentation closeout cannot bypass the existing construction register.
          if "docs/ROADMAP.md" in changed_files:
              def read_register(repo_name, sha):
                  doc = github_json(f"https://api.github.com/repos/{repo_name}/contents/docs/ROADMAP.md?ref={sha}")
                  road = base64.b64decode(doc["content"]).decode("utf-8")
                  marker = "## Completion-first V1 construction register —"
                  if road.count(marker) != 1:
                      raise ValueError("Construction register missing or duplicated")
                  block = road.split(marker, 1)[1].split("\n## ", 1)[0]
                  selected = re.findall(r"(?m)^- Next construction task: \*\*([A-Za-z0-9-]+)\*\*$", block)
                  rows = re.findall(r"(?m)^\|\s*\*\*((?:[568][A-F]?|7)-T\d{2})\*\*\s*\|\s*[^|]+\|\s*([^|]+)\|", block)
                  states = {name: state.strip() for name, state in rows}
                  if (len(selected) != 1 or len(states) != len(rows)
                          or [name for name, state in states.items() if state == "ACTIVE"] != selected):
                      raise ValueError("Exactly one selected ACTIVE construction task is required")
                  return selected[0], states

              try:
                  prior, before = read_register(repository, pr["base"]["sha"])
                  selected, after = read_register(pr["head"]["repo"]["full_name"], pr["head"]["sha"])
                  if not before.keys() <= after.keys():
                      errors.append("Do not remove existing construction tasks to bypass acceptance.")
                  closed = [name for name, state in after.items() if state in {"COMPLETE", "ACCEPTED"}
                            and before.get(name) not in {"COMPLETE", "ACCEPTED"}]
                  if closed:
                      for field in ("Activation evidence", "Acceptance evidence"):
                          value = field_value(field) or ""
                          allowed = ("PASS: ", "N/A: ") if field == "Activation evidence" else ("PASS: ",)
                          if (not value.startswith(allowed)
                                  or not all(re.search(r"\b" + re.escape(name) + r"\b", value) for name in closed)
                                  or not re.search(r"(?:docs/|https://github\.com/|#\d+)", value)):
                              errors.append(f"{field} needs PASS (activation-only N/A with reason), closing task IDs "
                                            f"({', '.join(closed)}) and existing evidence reference.")
                  if selected != prior and after.get(prior) not in {"COMPLETE", "ACCEPTED"}:
                      if after.get(prior) != "BLOCKED" or not field_value("Construction blocker") or not field_value("Resume condition"):
                          errors.append("Unfinished selected task requires BLOCKED state, Construction blocker and Resume condition before advancing.")
              except (KeyError, TypeError, ValueError, UnicodeError) as exc:
                  errors.append(f"Cannot validate completion closeout: {exc}")

          # Documentation-only governance work has no new metadata requirement.
          # ACTIVATE uses the existing External systems changed / Rollback point.
          # ACCEPT/RELEASE cite evidence in the existing Evidence / Remaining Gates.
          # This checker cannot declare provider/device evidence true.

          if level == "Level 1" and any(
              path.startswith(".github/workflows/") for path in changed_files
          ):
              errors.append(
                  "GitHub Actions workflow changes require at least Level 2 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.startswith("supabase/") for path in changed_files
          ):
              errors.append(
                  "Changes under supabase/ require Level 3 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.endswith((".jks", ".keystore")) for path in changed_files
          ):
              errors.append(
                  "Signing-keystore changes require Level 3 governance."
              )

          # Match declared PR scope against objective file ownership boundaries.
          # This does not prove that edits within a boundary were approved.
          declared_surfaces = (values.get("Affected surfaces") or "").casefold()
          guarded_surfaces = (
              ("app/", "Android client", ("android", "mobile", "room", "camera", "contractor client")),
              ("dashboard/", "Admin dashboard", ("dashboard", "admin", "browser", "web")),
              ("supabase/", "Supabase backend", ("supabase", "sql", "database", "auth", "rls", "rpc", "storage", "edge")),
              (".github/workflows/", "GitHub Actions", ("github actions", "ci", "workflow", "pipeline", "governance")),
          )
          for prefix, label, aliases in guarded_surfaces:
              if any(path.startswith(prefix) for path in changed_files) and not any(
                  re.search(r"\b" + re.escape(alias) + r"\b", declared_surfaces)
                  for alias in aliases
              ):
                  errors.append(
                      f"{label} files changed under {prefix!r}, but 'Affected surfaces' "
                      "does not declare that component. Reconcile the scope before proceeding."
                  )

          verification = (values.get("Verification boundary") or "").strip().casefold()
          if re.match(r"^(?:docs?|documentation|markdown)[ -]only\b", verification) and any(
              not path.endswith(".md") for path in changed_files
          ):
              errors.append(
                  "Verification boundary claims documentation-only review, "
                  "but the PR changes non-Markdown files."
              )

          # Reuse the existing PR handoff section; don't introduce a new form.
          # This validates presence of a checkpoint, not truth of reported evidence.
          if level in {"Level 2", "Level 3"}:
              handoff_heading = re.search(
                  r"(?im)^##[ \t]+Evidence[ \t]*/[ \t]*Remaining[ \t]+Gates[ \t]*$",
                  body,
              )
              if not handoff_heading:
                  errors.append(
                      "Level 2/3 work requires the existing 'Evidence / Remaining Gates' "
                      "PR section for durable handoff."
                  )
              else:
                  handoff_tail = body[handoff_heading.end():]
                  following_heading = re.search(r"(?m)^##[ \t]+", handoff_tail)
                  handoff_text = handoff_tail[
                      :following_heading.start() if following_heading else None
                  ]
                  handoff_text = re.sub(
                      r"<!--.*?-->", "", handoff_text, flags=re.DOTALL
                  ).strip()
                  if not handoff_text:
                      errors.append(
                          "The 'Evidence / Remaining Gates' section is empty; "
                          "preserve verified evidence and record the next checkpoint."
                      )
                  else:
                      if not re.search(
                          r"\b(?:pass|passed|success|verified|accepted|blocked|fail|failed|pending|not required|not run)\b",
                          handoff_text, flags=re.IGNORECASE
                      ):
                          errors.append(
                              "The handoff must identify actual PASS/BLOCKED/FAIL/PENDING "
                              "evidence (or state that verification is not required)."
                          )
                      if not re.search(r"\bnext\b", handoff_text, flags=re.IGNORECASE):
                          errors.append(
                              "The handoff must state the next checkpoint so subsequent "
                              "AI sessions can resume without restarting accepted work."
                          )

          if errors:
              print("Governance check FAILED:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Governance check PASS")
          print(f"PR: #{number}")
          print(f"Scope key: {scope_key}")
          print(f"Change level: {level}")
          print(f"Authoritative branch: {head_branch}")
          print(f"Draft: {draft}")
          print(f"Changed files inspected: {len(changed_files)}")
          PY
