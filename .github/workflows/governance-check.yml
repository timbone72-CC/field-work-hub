name: Governance Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR governance classification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          required_fields = [
              "Scope key",
              "Goal",
              "Affected surfaces",
              "Change level",
              "Authoritative branch",
              "Required rule packs",
              "Protected behavior",
              "External systems changed",
              "Rollback point",
              "Verification boundary",
              "Level 3 merge approval",
          ]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          pr = event["pull_request"]
          body = pr.get("body") or ""
          number = pr["number"]
          head_branch = pr["head"]["ref"]
          draft = bool(pr.get("draft"))
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def field_value(name, text=body):
              match = re.search(
                  rf"(?mi)^\s*-\s*{re.escape(name)}\s*:\s*(.*?)\s*$",
                  text,
              )
              if not match:
                  return None
              value = match.group(1).strip()
              value = re.sub(r"<!--.*?-->", "", value).strip()
              return value

          errors = []
          values = {}
          for name in required_fields:
              value = field_value(name)
              values[name] = value
              if not value:
                  errors.append(f"Missing or empty required field: {name}")

          level = values.get("Change level")
          if level and level not in {"Level 1", "Level 2", "Level 3"}:
              errors.append("Change level must be exactly Level 1, Level 2, or Level 3.")

          branch_value = values.get("Authoritative branch")
          if branch_value and branch_value != head_branch:
              errors.append(
                  f"Authoritative branch must match PR head branch: expected {head_branch!r}, "
                  f"found {branch_value!r}."
              )

          approval = values.get("Level 3 merge approval")
          if level == "Level 3":
              if approval not in {"PENDING", "APPROVED"}:
                  errors.append(
                      "Level 3 merge approval must be PENDING or APPROVED."
                  )
              if not draft and approval != "APPROVED":
                  errors.append(
                      "A non-draft Level 3 PR must record Level 3 merge approval as APPROVED."
                  )
          elif approval and approval != "N/A":
              errors.append("Level 1/2 PRs must record Level 3 merge approval as N/A.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "field-work-hub-governance-check",
          }

          def github_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          scope_key = values.get("Scope key")
          if scope_key:
              page = 1
              duplicates = []
              while True:
                  url = (
                      f"https://api.github.com/repos/{repository}/pulls"
                      f"?state=open&per_page=100&page={page}"
                  )
                  pulls = github_json(url)
                  if not pulls:
                      break
                  for other in pulls:
                      if other["number"] == number:
                          continue
                      other_body = other.get("body") or ""
                      match = re.search(
                          r"(?mi)^\s*-\s*Scope key\s*:\s*(.*?)\s*$",
                          other_body,
                      )
                      if not match:
                          continue
                      other_scope = re.sub(
                          r"<!--.*?-->",
                          "",
                          match.group(1),
                      ).strip()
                      if other_scope == scope_key:
                          duplicates.append(other["number"])
                  if len(pulls) < 100:
                      break
                  page += 1
              if duplicates:
                  errors.append(
                      f"Scope key {scope_key!r} is already used by open PR(s): "
                      + ", ".join(f"#{n}" for n in duplicates)
                      + ". Continue or explicitly supersede that line instead of opening a competing implementation."
                  )

          changed_files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/pulls/{number}/files"
                  f"?per_page=100&page={page}"
              )
              files = github_json(url)
              if not files:
                  break
              changed_files.extend(item["filename"] for item in files)
              if len(files) < 100:
                  break
              page += 1

          if level == "Level 1" and any(
              path.startswith(".github/workflows/") for path in changed_files
          ):
              errors.append(
                  "GitHub Actions workflow changes require at least Level 2 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.startswith("supabase/") for path in changed_files
          ):
              errors.append(
                  "Changes under supabase/ require Level 3 governance."
              )

          if level in {"Level 1", "Level 2"} and any(
              path.endswith((".jks", ".keystore")) for path in changed_files
          ):
              errors.append(
                  "Signing-keystore changes require Level 3 governance."
              )

          # Match declared PR scope against objective file ownership boundaries.
          # This does not prove that edits within a boundary were approved.
          declared_surfaces = (values.get("Affected surfaces") or "").casefold()
          guarded_surfaces = (
              ("app/", "Android client", ("android", "mobile", "room", "camera", "contractor client")),
              ("dashboard/", "Admin dashboard", ("dashboard", "admin", "browser", "web")),
              ("supabase/", "Supabase backend", ("supabase", "sql", "database", "auth", "rls", "rpc", "storage", "edge")),
              (".github/workflows/", "GitHub Actions", ("github actions", "ci", "workflow", "pipeline", "governance")),
          )
          for prefix, label, aliases in guarded_surfaces:
              if any(path.startswith(prefix) for path in changed_files) and not any(
                  re.search(r"\b" + re.escape(alias) + r"\b", declared_surfaces)
                  for alias in aliases
              ):
                  errors.append(
                      f"{label} files changed under {prefix!r}, but 'Affected surfaces' "
                      "does not declare that component. Reconcile the scope before proceeding."
                  )

          verification = (values.get("Verification boundary") or "").strip().casefold()
          if re.match(r"^(?:docs?|documentation|markdown)[ -]only\b", verification) and any(
              not path.endswith(".md") for path in changed_files
          ):
              errors.append(
                  "Verification boundary claims documentation-only review, "
                  "but the PR changes non-Markdown files."
              )

          if errors:
              print("Governance check FAILED:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Governance check PASS")
          print(f"PR: #{number}")
          print(f"Scope key: {scope_key}")
          print(f"Change level: {level}")
          print(f"Authoritative branch: {head_branch}")
          print(f"Draft: {draft}")
          print(f"Changed files inspected: {len(changed_files)}")
          PY
