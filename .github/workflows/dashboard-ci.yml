name: Admin Dashboard Gate CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject secrets, test-account PII, and unsafe auth storage
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sb_secret_|service_role' dashboard; then
            echo 'Forbidden elevated Supabase credential reference found in dashboard source.' >&2
            exit 1
          fi
          if grep -R -n -E 'timbone72@gmail\.com|rushingl27@gmail\.com' dashboard; then
            echo 'Test-account email must not be committed to dashboard source.' >&2
            exit 1
          fi
          if grep -R -n -E '57d08e76-7354-4edb-adea-027c805ac62c|e7208389-fb9f-4061-9fca-56301c021847' dashboard; then
            echo 'Test-account UUID must not be committed to dashboard source.' >&2
            exit 1
          fi
          if grep -R -n 'sessionStorage' dashboard --exclude='session.js'; then
            echo 'Auth sessionStorage use is allowed only in the dedicated tab-session helper.' >&2
            exit 1
          fi
          if grep -n 'sessionStorage' dashboard/session.js | grep -v 'ADMIN_SESSION_STORAGE_KEY'; then
            echo 'Every sessionStorage operation must use the one dedicated Admin session key.' >&2
            exit 1
          fi
          if grep -R -n 'localStorage' dashboard | grep -v 'WO_NUMBER_MODE_STORAGE_KEY' | grep -v -E '^dashboard/job-workspace.js:[0-9]+:.*JOB_VIEW_STORAGE_KEY'; then
            echo 'localStorage is allowed only for the dedicated non-sensitive numbering and account-scoped job-view preferences.' >&2
            exit 1
          fi
          if grep -R -n -E 'sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{30,}' supabase/functions 2>/dev/null; then
            echo 'Committed elevated Supabase credential/token found in Edge Function source.' >&2
            exit 1
          fi
      - name: Check dashboard JavaScript syntax
        run: |
          node --check dashboard/photo-requirements.js
          node --check dashboard/job-workspace.js
          node --check dashboard/app.js
          node --check dashboard/auto-refresh.js
          node --check dashboard/session.js
          node --check dashboard/contractors.js
          node --check dashboard/contractor-invite.js
      - name: Test automatic Admin updates and session races
        run: node --test tests/dashboard/*.test.js
      - name: Verify trusted private photo bytes and failure handling
        run: node --test tests/functions/*.test.mjs
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/fwh-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/fwh-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify compact workspace in disposable desktop and mobile browsers
        env:
          NODE_PATH: ${{ runner.temp }}/fwh-browser/node_modules
          FWH_BROWSER_OUTPUT: ${{ runner.temp }}/fwh-browser-evidence
        run: node tests/dashboard/browser/workspace.cjs
      - name: Upload disposable workspace browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fwh-workspace-browser-evidence
          path: ${{ runner.temp }}/fwh-browser-evidence/
          if-no-files-found: ignore
      - name: Verify refresh-safe Admin tab session
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ADMIN_SESSION_STORAGE_KEY' dashboard/session.js
          grep -q 'restoreAdminSession' dashboard/session.js
          grep -q 'grant_type=refresh_token' dashboard/session.js
          grep -q 'refresh_token' dashboard/session.js
          grep -q 'clearAdminSession' dashboard/session.js
          grep -q 'session.js?v=' dashboard/index.html
      - name: Verify partial-page authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TEST-OTHER-ORG-CONTROL' dashboard/app.js
          grep -q 'row.organization_id !== expectedOrganizationId' dashboard/app.js
          node --test tests/dashboard/job-workspace.test.js
          if grep -n -E 'organization_id=|assigned_user_id=' dashboard/app.js; then
            echo 'Dashboard work-order read request must not use client-side authorization filters.' >&2
            exit 1
          fi
      - name: Verify Phase 2 dispatch edit receipt and numbering paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'admin_list_assignable_users' dashboard/app.js
          grep -q 'admin_create_work_order' dashboard/app.js
          grep -q 'admin_update_work_order' dashboard/app.js
          grep -q 'p_generate_wo_number' dashboard/app.js
          grep -q 'assignment_received_at' dashboard/app.js
          grep -q 'pending_assignee_user_id' dashboard/app.js
          grep -q 'WO_NUMBER_MODE_STORAGE_KEY' dashboard/app.js
          grep -q 'id="wo-number-mode-auto"' dashboard/index.html
          grep -q 'id="wo-number-mode-custom"' dashboard/index.html
          grep -q 'id="remember-wo-number-mode"' dashboard/index.html
          grep -q 'id="create-wo-form"' dashboard/index.html
          grep -q 'id="edit-wo-form"' dashboard/index.html
          grep -q 'id="assignee"' dashboard/index.html
          grep -q 'id="edit-assignee"' dashboard/index.html
          if grep -n "method: 'PATCH'" dashboard/app.js; then
            echo 'Dashboard must not directly PATCH work_orders; use narrow RPCs.' >&2
            exit 1
          fi
      - name: Verify Contractor invite foundation and cancellation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'contractors.js?v=' dashboard/index.html
          grep -q 'admin_get_contractor_seat_summary' dashboard/contractors.js
          grep -q 'admin_list_pending_contractor_invitations' dashboard/contractors.js
          grep -q 'admin-invite-contractor' dashboard/contractors.js
          grep -q "operation: 'invite'" dashboard/contractors.js
          grep -q "operation: 'cancel'" dashboard/contractors.js
          grep -q 'Cancel Invitation' dashboard/contractors.js
          grep -q 'Refresh Contractors' dashboard/contractors.js
          grep -q 'complete_contractor_invitation_activation' dashboard/contractor-invite.js
          grep -q 'history.replaceState' dashboard/contractor-invite.js
          grep -q 'team_invitation_id' dashboard/contractor-invite.js
          grep -q 'contractor-invite.js?v=' dashboard/contractor-invite.html
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/admin-invite-contractor/index.ts
          grep -q "role: 'CONTRACTOR'" supabase/functions/admin-invite-contractor/index.ts
          grep -q 'team_finalize_contractor_invitation' supabase/functions/admin-invite-contractor/index.ts
          grep -q 'team_finalize_contractor_invitation_cancel' supabase/functions/admin-invite-contractor/index.ts
          grep -q 'admin_begin_contractor_invitation_cancel' supabase/functions/admin-invite-contractor/index.ts
          grep -q 'generateLink' supabase/functions/admin-invite-contractor/index.ts
          grep -q "type: 'invite'" supabase/functions/admin-invite-contractor/index.ts
          grep -q 'setup_url' supabase/functions/admin-invite-contractor/index.ts
          grep -q 'Copy Setup Link' dashboard/contractors.js
          grep -q 'navigator.clipboard.writeText' dashboard/contractors.js
          grep -q 'contractor-setup-link-result' dashboard/contractors.js
          if grep -q 'inviteUserByEmail' supabase/functions/admin-invite-contractor/index.ts; then
            echo 'Contractor onboarding must not depend on Supabase email delivery.' >&2
            exit 1
          fi
          grep -q 'deleteUser' supabase/functions/admin-invite-contractor/index.ts
      - name: Upload admin dashboard
        uses: actions/upload-artifact@v4
        with:
          name: field-work-hub-admin-dashboard
          path: dashboard/
          if-no-files-found: error
