name: Android Team Client CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Reject client secrets and test-account PII
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sb_secret_|service_role' app/src/main; then
            echo 'Forbidden elevated Supabase credential reference found in Android client source.' >&2
            exit 1
          fi
          if grep -R -n -E 'timbone72@gmail\.com|rushingl27@gmail\.com' app/src/main; then
            echo 'Test-account email must not be committed to Android client source.' >&2
            exit 1
          fi
      - name: Verify contractor receipt and reassignment consent paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'acknowledge_assignment_received' app/src/main/java/com/inandout/fieldphotoprep/team/internal/SupabaseApi.java
          grep -q 'respond_reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/SupabaseApi.java
          grep -q 'Approve Reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
          grep -q 'Decline Reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
          grep -q 'Assignment receipt: Confirmed' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
      - name: Run focused Phase 5 regression tests
        run: gradle :app:testDebugUnitTest --tests '*PhotoTransferTest' --tests '*SessionCoordinatorTest' --tests '*SessionOperationGuardTest' --tests '*RoomMigrationTest' --tests '*OfflineActionTest' --tests '*PhotoRequirementsTest' --tests '*FinishFeedbackTest' --tests '*ProtectedPhotoTest' --tests '*CameraLensMathTest'
      - name: Run complete Android JVM tests
        run: gradle :app:testDebugUnitTest
      - name: Build internal Team APK
        run: gradle :app:assembleDebug
      - name: Verify additive Room v1, v2, v3 and v4 schema exports
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="$(find app/schemas -type f -name '1.json' -print -quit)"
          test -n "${SCHEMA}"
          test -n "$(find app/schemas -type f -name 2.json -print -quit)"
          test -n "$(find app/schemas -type f -name 3.json -print -quit)"
          test -n "$(find app/schemas -type f -name 4.json -print -quit)"
          git ls-files --error-unmatch app/schemas/com.inandout.fieldphotoprep.team.internal.TeamDatabase/4.json
          git diff --exit-code -- app/schemas
          echo "Room schema: ${SCHEMA}"
          python3 - <<'PY'
          import pathlib
          schema = pathlib.Path('app/schemas/com.inandout.fieldphotoprep.team.internal.TeamDatabase/4.json')
          print('ROOM4_EXPORT_BEGIN')
          print(schema.read_text())
          print('ROOM4_EXPORT_END')
          PY
      - name: Verify Team client identity and network permission
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -f "${APK}"
          test -n "${AAPT}"
          "${AAPT}" dump badging "${APK}" | tee apk-badging.txt
          grep -q "package: name='com.inandout.fieldphotoprep.team.internal'" apk-badging.txt
          grep -q "application-label:'Field Work Hub Internal'" apk-badging.txt
          grep -q "application:.*icon='.*ic_launcher" apk-badging.txt
          unzip -Z1 "${APK}" > apk-resources.txt
          grep -q 'ic_launcher_foreground.png' apk-resources.txt
          grep -q 'ic_launcher_monochrome.png' apk-resources.txt
          grep -q 'ic_launcher.xml' apk-resources.txt
          "${AAPT}" dump permissions "${APK}" | tee apk-permissions.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
      - name: Verify stable Team test APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --print-certs "${APK}" > apk-signer.txt
          cat apk-signer.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          expected = "1bbff192f97a8a24c6f812d77df6847eb9759b3afb3c4b210d9e6c251f4eecfe"
          text = pathlib.Path("apk-signer.txt").read_text(encoding="utf-8")
          match = re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F]+)", text, re.IGNORECASE)
          if not match:
              print("Could not locate the APK certificate SHA-256 digest in apksigner output.", file=sys.stderr)
              sys.exit(1)
          actual = match.group(1).lower()
          print(f"Expected signer SHA-256: {expected}")
          print(f"Actual signer SHA-256:   {actual}")
          if actual != expected:
              sys.exit(1)
          PY
      - name: Freeze candidate identity and APK
        run: python3 ci/write_phase5_artifact_identity.py candidate
      - name: Upload FWH Phase 5 journal contractor APK
        uses: actions/upload-artifact@v4
        with:
          name: field-work-hub-phase5-apk
          path: phase5-artifacts/candidate/
          if-no-files-found: error
      - name: Build evidence-preserving recovery APK
        run: gradle :app:assembleDebug -PfwhRecovery
      - name: Verify and freeze recovery identity
        run: python3 ci/write_phase5_artifact_identity.py recovery
      - name: Upload evidence-preserving recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: field-work-hub-phase5-recovery-apk
          path: phase5-artifacts/recovery/
          if-no-files-found: error
      - name: Upload versioned Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: field-work-hub-room-schemas
          path: app/schemas
          if-no-files-found: error
