name: FWH Database Gate CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fwh-disposable-ci
          POSTGRES_DB: fwh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FWH_TEST_DATABASE_URL: postgresql://postgres:fwh-disposable-ci@localhost:5432/fwh_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Guard private review bucket configuration (source only)
        run: python3 tests/supabase/test_phase5_storage_config.py
      - name: Prepare disposable controlled Auth context
        run: psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/local_auth_context.sql
      - name: Apply every authoritative migration in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            if [[ "${migration##*/}" == "20261011190000_phase_6_corrective_run_foundation.sql" ]]; then
              # Reproduce the hosted upgrade on populated work/run tables, not
              # only an empty database (deferred FK events + same-file DDL).
              psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/local_test_actors.sql
              psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_corrective_migration_existing_work_seed.sql
            fi
            psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
            if [[ "${migration##*/}" == "20261011190000_phase_6_corrective_run_foundation.sql" ]]; then
              psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_corrective_migration_existing_work_check.sql
            fi
          done
      - name: Run controlled authority, replay and projection gates
        run: |
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_3a_database_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_3_actions_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_4_photos_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_company_templates_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_acceptance_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_alerts_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_corrective_run_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_correction_admin_draft_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_access_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_scoped_admin_invitation_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_scoped_admin_auth_handoff_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_staffing_scope_snapshot_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_supervisor_work_page_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_supervisor_assignment_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_team_handoff_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_historical_handoff_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_contractor_roster_snapshot_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_6_tier2_new_team_invite_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_bootstrap_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/disposable_other_org_bootstrap_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_recovery_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_exact_test_atomic_recovery_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_parent_confirmation_receipt_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_recovery_private_gallery_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_transfer_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_upload_start_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_private_review_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_client_policy_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_client_destination_proposal_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_late_client_binding_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_legacy_work_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_lifecycle_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_invitation_guard_gate.sql
          psql "$FWH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase/phase_5_reviewed_access_gate.sql
      - name: Verify real two-connection mutation races
        run: |
          python3 -m pip install 'psycopg[binary]==3.2.10'
          python3 tests/supabase/phase_3_lock_races.py
          python3 tests/supabase/phase_4_lock_races.py
          python3 tests/supabase/phase_5_bootstrap_races.py
          python3 tests/supabase/phase_5_recovery_races.py
          python3 tests/supabase/phase_6_historical_handoff_races.py
          python3 tests/supabase/phase_5_legacy_work_races.py
          python3 tests/supabase/phase_5_auth_lock_order_races.py
          python3 tests/supabase/phase_5_lifecycle_races.py
          python3 tests/supabase/phase_5_invitation_races.py
          python3 tests/supabase/phase_5_reviewed_access_races.py
          python3 tests/supabase/phase_5_verification_races.py
      - name: Verify nonretryable conflicts through disposable PostgREST 14.5
        run: python3 tests/supabase/phase_6_nonretryable_conflict_http.py
