name: FWH Verified Internal UI TEST Publisher

# The trusted workflow definition must live on main before this can publish.
# PR source is NEVER checked out, evaluated or executed in this privileged job.
on:
  pull_request:
    paths:
      - ".github/workflows/internal-ui-test-auto-release.yml"
      - "ci/auto_publish_verified_ui.py"
      - "tests/ci/test_auto_publish_verified_ui.py"
  workflow_run:
    workflows:
      - "Android Team Client CI"
      - "FWH Database Gate CI"
      - "Admin Dashboard Gate CI"
    types: [completed]

permissions:
  contents: read

jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed publisher policy
        run: python3 -m unittest discover -s tests/ci -p 'test_auto_publish_verified_ui.py' -v

  publish:
    # The workflow-run event comes from GitHub itself, not from PR source.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feat/phase-5-6-dashboard-workflow' &&
      github.event.workflow_run.head_repository.full_name == 'timbone72-CC/field-work-hub'
    runs-on: ubuntu-latest
    # Restrict the queue to eligible publish jobs only. Ineligible push/completion
    # workflows must NOT evict the final verified PR release event from the queue.
    concurrency:
      group: fwh-internal-ui-test-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable trusted publisher on main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck publisher fail-closed tests before privileged operation
        run: python3 -m unittest discover -s tests/ci -p 'test_auto_publish_verified_ui.py' -v
      - name: Publish only final-ready, verified, newer public TEST APK
        env:
          GH_TOKEN: ${{ github.token }}
          FWH_UI_AUTO_RELEASE_ENABLED: ${{ vars.FWH_UI_AUTO_RELEASE_ENABLED || 'true' }}
        run: python3 ci/auto_publish_verified_ui.py
