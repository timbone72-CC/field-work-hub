plugins {
    id 'com.android.application'
}

def stableTestKeystore = rootProject.file('ci/field-photo-prep-team-test.jks')
def roomSchemaDir = file("$projectDir/schemas")

// Deliberate, locally opt-in TEST variant; never selected by ordinary CI,
// trusted public publisher or the updater's standard release path.
def readinessProperty = project.findProperty('fwhReadinessTest')
if (readinessProperty != null && readinessProperty.toString() != 'true') {
    throw new GradleException('fwhReadinessTest requires an explicit value of true')
}
def readinessTest = readinessProperty != null
def recoveryBuild = project.hasProperty('fwhRecovery')
if (readinessTest) {
    // Fail closed if the same package is ever pointed at a different backend.
    def config = file('src/main/java/com/inandout/fieldphotoprep/team/internal/SupabaseConfig.java').getText('UTF-8')
    if (!config.contains('static final String PROJECT_URL = "https://vyocaujuwrivoqynvitm.supabase.co";')) {
        throw new GradleException('Read-only TEST polling requires the exact authorized FWH TEST project')
    }
}

android {
    namespace 'com.inandout.fieldphotoprep.team.internal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.inandout.fieldphotoprep.team.internal'
        minSdk 26
        targetSdk 36
        // Standard builds keep the already verified v40/v41 identity.
        // The opt-in candidate is a safe in-place v42 TEST update; its paired
        // v43 recovery understands Room6 and shuts off every network drain.
        versionCode (readinessTest ? (recoveryBuild ? 43 : 42) : (recoveryBuild ? 41 : 40))
        versionName (readinessTest
            ? (recoveryBuild ? '0.5-phase5-readiness-v43-recovery-internal'
                             : '0.5-phase5-readiness-v42-test-internal')
            : (recoveryBuild ? '0.5-phase5-merged-v41-recovery-internal'
                             : '0.5-phase5-merged-v40-internal'))
        buildConfigField 'boolean', 'FIELD_SYNC_ENABLED', recoveryBuild ? 'false' : 'true'
        // Read-only TEST polling is independent of destructive cleanup.
        // Default/recovery builds OFF; -PfwhReadinessTest=true is required
        // only for the unpublished, TEST-pinned v42 candidate.
        buildConfigField 'boolean', 'CLEANUP_READINESS_POLLING_ENABLED',
            (readinessTest && !recoveryBuild) ? 'true' : 'false'
        buildConfigField 'boolean', 'AUTOMATIC_CLEANUP_ENABLED', 'false'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": roomSchemaDir.path,
                    "room.incremental": "true"
                ]
            }
        }
    }

    // Public, non-production signer used only so internal test APK updates are stable.
    signingConfigs {
        stableTest {
            storeFile stableTestKeystore
            storePassword 'field-photo-prep-team-test'
            keyAlias 'field-photo-prep-team-test'
            keyPassword 'field-photo-prep-team-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets { test.resources.srcDirs += files(roomSchemaDir) }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.core:core:1.16.0'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    testImplementation 'androidx.work:work-testing:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
