plugins {
    id 'com.android.application'
}

def stableTestKeystore = rootProject.file('ci/field-photo-prep-team-test.jks')
def roomSchemaDir = file("$projectDir/schemas")

android {
    namespace 'com.inandout.fieldphotoprep.team.internal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.inandout.fieldphotoprep.team.internal'
        minSdk 26
        targetSdk 36
        versionCode (project.hasProperty("fwhRecovery") ? 19 : 18)
        versionName (project.hasProperty('fwhRecovery') ? '0.5-phase5-journal-recovery-internal' : '0.5-phase5-journal-internal')
        buildConfigField 'boolean', 'FIELD_SYNC_ENABLED', project.hasProperty('fwhRecovery') ? 'false' : 'true'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": roomSchemaDir.path,
                    "room.incremental": "true"
                ]
            }
        }
    }

    // Public, non-production signer used only so internal test APK updates are stable.
    signingConfigs {
        stableTest {
            storeFile stableTestKeystore
            storePassword 'field-photo-prep-team-test'
            keyAlias 'field-photo-prep-team-test'
            keyPassword 'field-photo-prep-team-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets { test.resources.srcDirs += files(roomSchemaDir) }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    testImplementation 'androidx.work:work-testing:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
